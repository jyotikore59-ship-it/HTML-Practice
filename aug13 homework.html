<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Resistration page</title>
</head>
<body>
   <marquee><h1>Student registration page for job</h1></marquee> <hr>
    <from action="#jyoti">
        <center>
            <table border="1">
                <tr>
                    <td>Username:</td>
                    <td><input type="text"name=""placeholder="enter your name"><br><br></td>
                </tr>
                <tr>
                    <td>Address:</td>
                    <td><textarea type="text"name=""placeholder="enter address" rows="12"cols="12"></textarea><br><br>
                       </td>
                       
                </tr>
                <tr>
                    <td>Male:</td>
                    <td><input type="radio"name="gender"value="male" ></td>
                </tr>
                <tr>
                    <td>Female:</td>
                    <td><input type="radio" name="gender"value="female"></td>
                </tr>
                <tr>
                    <td>Other:</td>
                    <td><input type="radio" name="gender"value="other"checked></td>
                </tr>
                <tr>
                    <td>Skills:</td>
                   <td>

                    Python<input type="checkbox"name="python" checked>
                    Java<input type="checkbox"name="Java">
                    DS<input type="checkbox"name="DS">
                    DA<input type="checkbox"name="DA">
                    

                   </td>

                </tr>  
                <br>
                <tr>
                    <td>Country:</td>
                <td>
                    <select name="country"id="">

                        <option value="india">india</option>
                        <option value="uk">UK</option>
                        <option value="us">US</option>
                        <option value="america">AMERICA</option>
                        <option value="japan">JAPAN</option>
                        <option value="france">FRANCE</option>

                    </select>
                </td>   
                   
                </tr>
                <tr>
                    
                        <td colspan="2"style="text-align:center;">
                            <button type="submit">register</button></td>   

                   
                    
                </tr>
                
               
                </table>
            
                
        </center>
        
    </from>
</body>
</html>
